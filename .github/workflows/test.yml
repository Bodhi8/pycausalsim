name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v

      - name: Run examples
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          MPLBACKEND: Agg
        run: |
          status=0
          for f in examples/*.py; do
            echo "::group::$f"
            if ! python "$f" > example.log 2>&1; then
              cat example.log
              msg=$(tail -n 4 example.log | tr '\n' ' ' | cut -c1-600)
              echo "::error title=$f failed::$msg"
              status=1
            else
              tail -n 5 example.log
            fi
            echo "::endgroup::"
          done
          exit $status
